plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// VERSION is shared with the desktop ports. Android requires an internal integer.
def versionText = new File(rootDir, "../../VERSION").text.trim()
if (!(versionText ==~ /(?:0|[1-9][0-9]{0,2})\.(?:0|[1-9][0-9]{0,2})(?:\.(?:0|[1-9][0-9]{0,2}))?/))
    throw new GradleException("Invalid VERSION")
def parts = versionText.tokenize('.').collect { it.toInteger() }
def versionNumber = parts[0] * 1000000 + parts[1] * 1000 + (parts.size() == 3 ? parts[2] : 0)
def releaseTag = "refs/tags/v" + versionText
def releaseRef = System.getenv("GITHUB_REF") ?: ""
if (releaseRef.startsWith("refs/tags/v") && releaseRef != releaseTag)
    throw new GradleException("Release tag must match VERSION")
def officialRelease = System.getenv("GITHUB_REPOSITORY") == "chestahh/GulchCE" && releaseRef == releaseTag

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId "com.halo.decomp"
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, versionNumber)
        versionName "v" + versionText
        buildConfigField "boolean", "GULCHCE_RELEASE", "${officialRelease}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
